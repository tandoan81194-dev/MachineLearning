[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "training-lead-scoring-api"
version = "0.1.0"
description = "Python ML training pipeline and FastAPI inference service for training lead scoring."
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.138.2",
  "uvicorn[standard]==0.49.0",
  "pandas==3.0.3",
  "openpyxl==3.1.5",
  "scikit-learn==1.9.0",
  "joblib==1.5.3",
  "pydantic==2.13.4",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "boto3>=1.34,<2"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
lead-scoring = "app.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
